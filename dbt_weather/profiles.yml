weather:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('POSTGRES_USER', 'weather') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'weather') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'weather') }}"
      schema: public
      threads: 4
      sslmode: "{{ env_var('POSTGRES_SSLMODE', 'prefer') }}"
      connect_timeout: 30
      retries: 2
