version: 2

sources:
  - name: raw
    schema: raw
    config:
      # `dbt source freshness` fails the run when the extractor stops loading data
      loaded_at_field: fetched_at
      freshness:
        warn_after: {count: 2, period: hour}
        error_after: {count: 6, period: hour}
    tables:
      - name: weather_raw
        description: "Raw Open-Meteo JSON responses loaded by the Python extractor."
