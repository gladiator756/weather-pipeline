version: 2

models:
  - name: dim_location
    columns:
      - name: location_id
        tests: [unique, not_null]
      - name: location_name
        tests: [not_null]

  - name: dim_date
    columns:
      - name: date_id
        tests: [unique, not_null]

  - name: fact_weather
    columns:
      - name: observation_id
        tests: [unique, not_null]
      - name: location_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_id
      - name: date_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_id
      - name: temperature_c
        tests: [not_null]
